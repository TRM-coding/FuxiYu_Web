<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <!-- 手机外壳 -->
  <rect x="60" y="8" width="240" height="454" rx="20" fill="#f5f5f5" stroke="#d9d9d9"/>

  <!-- 导航栏 -->
  <rect x="60" y="26" width="240" height="34" fill="#ffffff"/>
  <text x="88" y="47" font-size="11" fill="#595959">我的容器</text>
  <text x="150" y="47" font-size="11" fill="#1677ff" font-weight="bold">容器申请</text>
  <text x="214" y="47" font-size="11" fill="#595959">说明</text>
  <rect x="146" y="54" width="54" height="2" fill="#1677ff"/>

  <!-- 筛选行 -->
  <rect x="72" y="68" width="216" height="40" rx="6" fill="#ffffff" stroke="#f0f0f0"/>
  <text x="82" y="92" font-size="10" fill="#595959">类型：</text>
  <rect x="112" y="76" width="44" height="24" rx="4" fill="#1677ff"/><text x="126" y="92" font-size="10" fill="#ffffff">CPU</text>
  <rect x="160" y="76" width="44" height="24" rx="4" fill="#ffffff" stroke="#d9d9d9"/><text x="174" y="92" font-size="10" fill="#595959">GPU</text>

  <!-- 机器卡片1 -->
  <rect x="72" y="116" width="216" height="72" rx="8" fill="#ffffff" stroke="#f0f0f0"/>
  <text x="84" y="136" font-size="12" fill="#262626" font-weight="bold">gpu-node-01</text>
  <rect x="188" y="124" width="38" height="18" rx="4" fill="#fff7e6" stroke="#ffd591"/><text x="196" y="137" font-size="9" fill="#d46b08">GPU</text>
  <text x="84" y="156" font-size="10" fill="#8c8c8c">192.168.5.23</text>
  <circle cx="90" cy="172" r="3" fill="#52c41a"/>
  <text x="97" y="175" font-size="10" fill="#389e0d">online · 4×A100 · 256GB</text>
  <rect x="228" y="132" width="46" height="22" rx="4" fill="#e6f4ff" stroke="#91caff"/><text x="240" y="147" font-size="10" fill="#1677ff">申请</text>

  <!-- 机器卡片2 -->
  <rect x="72" y="196" width="216" height="72" rx="8" fill="#ffffff" stroke="#f0f0f0"/>
  <text x="84" y="216" font-size="12" fill="#262626" font-weight="bold">cpu-node-02</text>
  <rect x="188" y="204" width="38" height="18" rx="4" fill="#f6ffed" stroke="#b7eb8f"/><text x="196" y="217" font-size="9" fill="#389e0d">CPU</text>
  <text x="84" y="236" font-size="10" fill="#8c8c8c">192.168.5.24</text>
  <circle cx="90" cy="252" r="3" fill="#52c41a"/>
  <text x="97" y="255" font-size="10" fill="#389e0d">online · 128GB</text>
  <rect x="228" y="212" width="46" height="22" rx="4" fill="#e6f4ff" stroke="#91caff"/><text x="240" y="227" font-size="10" fill="#1677ff">申请</text>

  <!-- 表单卡片 -->
  <rect x="72" y="284" width="216" height="86" rx="8" fill="#ffffff" stroke="#91caff" stroke-width="1.2"/>
  <text x="84" y="306" font-size="12" fill="#262626" font-weight="bold">申请容器</text>
  <text x="84" y="326" font-size="10" fill="#595959">容器名：</text>
  <rect x="132" y="315" width="144" height="18" rx="3" fill="#ffffff" stroke="#d9d9d9"/><text x="138" y="328" font-size="9" fill="#bfbfbf">英文/数字/下划线</text>
  <text x="84" y="348" font-size="10" fill="#595959">镜像：</text>
  <rect x="132" y="337" width="144" height="18" rx="3" fill="#ffffff" stroke="#d9d9d9"/><text x="138" y="350" font-size="9" fill="#262626">ubuntu:24.04 ▾</text>
  <rect x="160" y="356" width="56" height="18" rx="4" fill="#1677ff"/><text x="173" y="369" font-size="9" fill="#ffffff">提交</text>

  <!-- 底部说明 -->
  <rect x="72" y="396" width="216" height="54" rx="6" fill="#fffbe6" stroke="#ffe58f"/>
  <text x="82" y="414" font-size="10" fill="#ad6800">① 筛选机器（类型过滤）</text>
  <text x="82" y="430" font-size="10" fill="#ad6800">② 点「申请」填表（配额不超上限）</text>
  <text x="82" y="446" font-size="10" fill="#ad6800">③ 提交后回「我的容器」看状态</text>
</svg>
