<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <!-- 浏览器窗 -->
  <rect x="10" y="10" width="840" height="450" rx="10" fill="#f5f5f5" stroke="#d9d9d9"/>
  <rect x="10" y="10" width="840" height="34" rx="10" fill="#ffffff" stroke="#d9d9d9"/>
  <circle cx="30" cy="27" r="5" fill="#ff5f57"/><circle cx="46" cy="27" r="5" fill="#febc2e"/><circle cx="62" cy="27" r="5" fill="#28c840"/>
  <rect x="120" y="17" width="520" height="20" rx="10" fill="#f0f0f0"/>
  <text x="132" y="31" font-size="12" fill="#8c8c8c">https://平台地址/#/index/apply</text>

  <!-- 顶部导航 -->
  <rect x="10" y="44" width="840" height="36" fill="#ffffff"/>
  <text x="40" y="66" font-size="13" fill="#595959">我的容器</text>
  <text x="130" y="66" font-size="13" fill="#1677ff" font-weight="bold">容器申请</text>
  <text x="220" y="66" font-size="13" fill="#595959">使用说明</text>
  <rect x="120" y="74" width="80" height="2" fill="#1677ff"/>

  <!-- 筛选区 -->
  <rect x="20" y="92" width="820" height="52" rx="6" fill="#ffffff" stroke="#f0f0f0"/>
  <text x="40" y="122" font-size="12" fill="#595959">设备类型：</text>
  <rect x="105" y="104" width="56" height="26" rx="4" fill="#1677ff"/><text x="123" y="122" font-size="12" fill="#ffffff">CPU</text>
  <rect x="167" y="104" width="56" height="26" rx="4" fill="#ffffff" stroke="#d9d9d9"/><text x="185" y="122" font-size="12" fill="#595959">GPU</text>
  <text x="250" y="122" font-size="12" fill="#595959">IP地址：</text>
  <rect x="305" y="104" width="140" height="26" rx="4" fill="#ffffff" stroke="#d9d9d9"/><text x="315" y="122" font-size="11" fill="#bfbfbf">XXX.XXX.XXX.XXX</text>
  <text x="470" y="122" font-size="12" fill="#595959">机器ID：</text>
  <rect x="520" y="104" width="100" height="26" rx="4" fill="#ffffff" stroke="#d9d9d9"/><text x="530" y="122" font-size="11" fill="#bfbfbf">机器ID</text>

  <!-- 机器表格 -->
  <rect x="20" y="152" width="820" height="30" fill="#fafafa" stroke="#f0f0f0"/>
  <text x="40" y="171" font-size="12" fill="#595959" font-weight="bold">机器名</text>
  <text x="200" y="171" font-size="12" fill="#595959" font-weight="bold">IP</text>
  <text x="330" y="171" font-size="12" fill="#595959" font-weight="bold">类型</text>
  <text x="420" y="171" font-size="12" fill="#595959" font-weight="bold">状态</text>
  <text x="540" y="171" font-size="12" fill="#595959" font-weight="bold">GPU</text>
  <text x="620" y="171" font-size="12" fill="#595959" font-weight="bold">内存</text>
  <text x="730" y="171" font-size="12" fill="#595959" font-weight="bold">操作</text>

  <rect x="20" y="182" width="820" height="44" fill="#ffffff" stroke="#f0f0f0"/>
  <text x="40" y="208" font-size="12" fill="#262626">gpu-node-01</text>
  <text x="200" y="208" font-size="12" fill="#8c8c8c">192.168.5.23</text>
  <rect x="325" y="192" width="44" height="22" rx="4" fill="#fff7e6" stroke="#ffd591"/><text x="335" y="207" font-size="11" fill="#d46b08">GPU</text>
  <rect x="412" y="192" width="62" height="22" rx="4" fill="#f6ffed" stroke="#b7eb8f"/>
  <circle cx="424" cy="203" r="3" fill="#52c41a"/>
  <text x="432" y="207" font-size="11" fill="#389e0d">online</text>
  <text x="540" y="208" font-size="12" fill="#262626">4×A100</text>
  <text x="620" y="208" font-size="12" fill="#262626">256GB</text>
  <rect x="722" y="192" width="56" height="22" rx="4" fill="#e6f4ff" stroke="#91caff"/><text x="736" y="207" font-size="11" fill="#1677ff">申请</text>

  <rect x="20" y="226" width="820" height="44" fill="#ffffff" stroke="#f0f0f0"/>
  <text x="40" y="252" font-size="12" fill="#262626">cpu-node-02</text>
  <text x="200" y="252" font-size="12" fill="#8c8c8c">192.168.5.24</text>
  <rect x="325" y="236" width="44" height="22" rx="4" fill="#f6ffed" stroke="#b7eb8f"/><text x="335" y="251" font-size="11" fill="#389e0d">CPU</text>
  <rect x="412" y="236" width="62" height="22" rx="4" fill="#f6ffed" stroke="#b7eb8f"/>
  <circle cx="424" cy="247" r="3" fill="#52c41a"/>
  <text x="432" y="251" font-size="11" fill="#389e0d">online</text>
  <text x="540" y="252" font-size="12" fill="#8c8c8c">-</text>
  <text x="620" y="252" font-size="12" fill="#262626">128GB</text>
  <rect x="722" y="236" width="56" height="22" rx="4" fill="#e6f4ff" stroke="#91caff"/><text x="736" y="251" font-size="11" fill="#1677ff">申请</text>

  <!-- 标注圆点：置于空白边距 -->
  <circle cx="800" cy="118" r="9" fill="#1677ff"/><text x="795" y="122" font-size="11" fill="#ffffff" font-weight="bold">1</text>
  <circle cx="795" cy="204" r="9" fill="#1677ff"/><text x="790" y="208" font-size="11" fill="#1677ff" font-weight="bold">2</text>
  <circle cx="620" cy="382" r="9" fill="#1677ff"/><text x="615" y="386" font-size="11" fill="#ffffff" font-weight="bold">3</text>

  <!-- 申请弹窗 -->
  <rect x="250" y="290" width="350" height="150" rx="8" fill="#ffffff" stroke="#91caff" stroke-width="1.5"/>
  <text x="270" y="318" font-size="14" fill="#262626" font-weight="bold">申请容器</text>
  <text x="270" y="346" font-size="12" fill="#595959">容器名：</text>
  <rect x="330" y="332" width="180" height="22" rx="4" fill="#ffffff" stroke="#d9d9d9"/><text x="340" y="348" font-size="11" fill="#bfbfbf">英文/数字/下划线</text>
  <text x="270" y="378" font-size="12" fill="#595959">镜像：</text>
  <rect x="330" y="364" width="180" height="22" rx="4" fill="#ffffff" stroke="#d9d9d9"/><text x="340" y="380" font-size="11" fill="#262626">ubuntu:24.04 ▾</text>
  <text x="270" y="410" font-size="12" fill="#595959">CPU / 内存 / GPU / 共享空间…</text>
  <rect x="430" y="404" width="70" height="24" rx="4" fill="#1677ff"/><text x="447" y="421" font-size="12" fill="#ffffff">提交</text>

  <!-- 标注说明框：右侧空白区，避开弹窗 -->
  <rect x="640" y="276" width="210" height="66" rx="6" fill="#fffbe6" stroke="#ffe58f"/>
  <text x="650" y="296" font-size="11" fill="#ad6800" font-weight="bold">① 筛选宿主机</text>
  <text x="650" y="313" font-size="11" fill="#ad6800">类型 / IP / ID 定位，</text>
  <text x="650" y="330" font-size="11" fill="#ad6800">仅 online 且有权限可申</text>

  <rect x="20" y="276" width="210" height="66" rx="6" fill="#fffbe6" stroke="#ffe58f"/>
  <text x="30" y="296" font-size="11" fill="#ad6800" font-weight="bold">② 点击申请</text>
  <text x="30" y="313" font-size="11" fill="#ad6800">填写容器名 / 镜像 /</text>
  <text x="30" y="330" font-size="11" fill="#ad6800">算力配额，不超上限</text>

  <rect x="640" y="370" width="210" height="66" rx="6" fill="#fffbe6" stroke="#ffe58f"/>
  <text x="650" y="390" font-size="11" fill="#ad6800" font-weight="bold">③ 提交等待</text>
  <text x="650" y="407" font-size="11" fill="#ad6800">回"我的容器"页，</text>
  <text x="650" y="424" font-size="11" fill="#ad6800">creating → online 可用</text>
</svg>
