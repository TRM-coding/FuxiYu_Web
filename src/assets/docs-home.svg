<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <!-- 浏览器窗 -->
  <rect x="10" y="10" width="840" height="450" rx="10" fill="#f5f5f5" stroke="#d9d9d9"/>
  <rect x="10" y="10" width="840" height="34" rx="10" fill="#ffffff" stroke="#d9d9d9"/>
  <circle cx="30" cy="27" r="5" fill="#ff5f57"/><circle cx="46" cy="27" r="5" fill="#febc2e"/><circle cx="62" cy="27" r="5" fill="#28c840"/>
  <rect x="120" y="17" width="520" height="20" rx="10" fill="#f0f0f0"/>
  <text x="132" y="31" font-size="12" fill="#8c8c8c">https://平台地址/#/index</text>

  <!-- 顶部导航 -->
  <rect x="10" y="44" width="840" height="36" fill="#ffffff"/>
  <text x="40" y="66" font-size="13" fill="#1677ff" font-weight="bold">我的容器</text>
  <text x="130" y="66" font-size="13" fill="#595959">容器申请</text>
  <text x="220" y="66" font-size="13" fill="#595959">使用说明</text>
  <rect x="20" y="74" width="80" height="2" fill="#1677ff"/>

  <!-- 表格头部 -->
  <rect x="20" y="92" width="820" height="30" fill="#fafafa" stroke="#f0f0f0"/>
  <text x="40" y="111" font-size="12" fill="#595959" font-weight="bold">容器</text>
  <text x="170" y="111" font-size="12" fill="#595959" font-weight="bold">镜像</text>
  <text x="300" y="111" font-size="12" fill="#595959" font-weight="bold">宿主机</text>
  <text x="420" y="111" font-size="12" fill="#595959" font-weight="bold">状态</text>
  <text x="560" y="111" font-size="12" fill="#595959" font-weight="bold">剩余时间</text>
  <text x="680" y="111" font-size="12" fill="#595959" font-weight="bold">操作</text>

  <!-- 标注圆点（置于表头行的空白处，不压数据） -->
  <circle cx="450" cy="107" r="9" fill="#1677ff"/><text x="445" y="111" font-size="11" fill="#ffffff" font-weight="bold">1</text>
  <circle cx="605" cy="107" r="9" fill="#1677ff"/><text x="600" y="111" font-size="11" fill="#ffffff" font-weight="bold">2</text>
  <circle cx="740" cy="107" r="9" fill="#1677ff"/><text x="735" y="111" font-size="11" fill="#ffffff" font-weight="bold">3</text>

  <!-- 行1：online -->
  <rect x="20" y="122" width="820" height="44" fill="#ffffff" stroke="#f0f0f0"/>
  <text x="40" y="148" font-size="12" fill="#262626">container_01</text>
  <text x="170" y="148" font-size="12" fill="#262626">ubuntu:24.04</text>
  <text x="300" y="148" font-size="12" fill="#8c8c8c">192.168.5.23</text>
  <rect x="412" y="131" width="62" height="22" rx="4" fill="#f6ffed" stroke="#b7eb8f"/>
  <circle cx="424" cy="142" r="3" fill="#52c41a"/>
  <text x="432" y="146" font-size="11" fill="#389e0d">online</text>
  <text x="560" y="148" font-size="12" fill="#262626">6天 12小时</text>
  <rect x="672" y="131" width="40" height="22" rx="4" fill="#ffffff" stroke="#d9d9d9"/><text x="682" y="146" font-size="11" fill="#262626">启动</text>
  <rect x="718" y="131" width="40" height="22" rx="4" fill="#ffffff" stroke="#d9d9d9"/><text x="728" y="146" font-size="11" fill="#262626">停止</text>
  <rect x="764" y="131" width="40" height="22" rx="4" fill="#fff1f0" stroke="#ffa39e"/><text x="774" y="146" font-size="11" fill="#cf1322">删除</text>

  <!-- 行2：creating -->
  <rect x="20" y="166" width="820" height="44" fill="#ffffff" stroke="#f0f0f0"/>
  <text x="40" y="192" font-size="12" fill="#262626">container_02</text>
  <text x="170" y="192" font-size="12" fill="#262626">ubuntu:22.04</text>
  <text x="300" y="192" font-size="12" fill="#8c8c8c">192.168.5.24</text>
  <rect x="412" y="175" width="76" height="22" rx="4" fill="#e6f4ff" stroke="#91caff"/>
  <circle cx="424" cy="186" r="3" fill="#1677ff"/>
  <text x="432" y="190" font-size="11" fill="#0958d9">creating</text>
  <text x="560" y="192" font-size="12" fill="#8c8c8c">-</text>
  <text x="672" y="192" font-size="11" fill="#bfbfbf">等待就绪</text>

  <!-- 行3：offline -->
  <rect x="20" y="210" width="820" height="44" fill="#ffffff" stroke="#f0f0f0"/>
  <text x="40" y="236" font-size="12" fill="#262626">container_03</text>
  <text x="170" y="236" font-size="12" fill="#262626">ubuntu:20.04</text>
  <text x="300" y="236" font-size="12" fill="#8c8c8c">192.168.5.25</text>
  <rect x="412" y="219" width="68" height="22" rx="4" fill="#fafafa" stroke="#d9d9d9"/>
  <circle cx="424" cy="230" r="3" fill="#8c8c8c"/>
  <text x="432" y="234" font-size="11" fill="#595959">offline</text>
  <text x="560" y="236" font-size="12" fill="#8c8c8c">-</text>
  <rect x="672" y="219" width="40" height="22" rx="4" fill="#ffffff" stroke="#d9d9d9"/><text x="682" y="234" font-size="11" fill="#262626">启动</text>

  <!-- 标注说明框：底部一行三个，互不重叠 -->
  <rect x="20" y="276" width="260" height="72" rx="6" fill="#fffbe6" stroke="#ffe58f"/>
  <text x="30" y="296" font-size="11" fill="#ad6800" font-weight="bold">① 状态列</text>
  <text x="30" y="313" font-size="11" fill="#ad6800">online 运行中 / offline 已停止</text>
  <text x="30" y="330" font-size="11" fill="#ad6800">creating 创建中 / failed 失败</text>

  <rect x="300" y="276" width="260" height="72" rx="6" fill="#fffbe6" stroke="#ffe58f"/>
  <text x="310" y="296" font-size="11" fill="#ad6800" font-weight="bold">② 剩余时间</text>
  <text x="310" y="313" font-size="11" fill="#ad6800">距自动清理倒计时；SSH 登录</text>
  <text x="310" y="330" font-size="11" fill="#ad6800">即重置 7 天；长期容器豁免</text>

  <rect x="580" y="276" width="260" height="72" rx="6" fill="#fffbe6" stroke="#ffe58f"/>
  <text x="590" y="296" font-size="11" fill="#ad6800" font-weight="bold">③ 操作列</text>
  <text x="590" y="313" font-size="11" fill="#ad6800">启动 / 停止 / 重启立即下发；</text>
  <text x="590" y="330" font-size="11" fill="#ad6800">删除不可恢复，操作前确认</text>

  <!-- 底部提示条 -->
  <rect x="20" y="368" width="820" height="44" rx="6" fill="#e6f4ff"/>
  <text x="40" y="395" font-size="12" fill="#0958d9">协作：点击容器行可邀请同学加入（collaborator / admin），共享同一容器环境。</text>
</svg>
