<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <!-- 手机外壳 -->
  <rect x="60" y="8" width="240" height="454" rx="20" fill="#f5f5f5" stroke="#d9d9d9"/>

  <!-- 导航栏 -->
  <rect x="60" y="26" width="240" height="34" fill="#ffffff"/>
  <text x="88" y="47" font-size="11" fill="#1677ff" font-weight="bold">我的容器</text>
  <text x="150" y="47" font-size="11" fill="#595959">容器申请</text>
  <text x="214" y="47" font-size="11" fill="#595959">说明</text>
  <rect x="82" y="54" width="54" height="2" fill="#1677ff"/>

  <!-- 容器卡片1 -->
  <rect x="72" y="68" width="216" height="96" rx="8" fill="#ffffff" stroke="#f0f0f0"/>
  <text x="84" y="88" font-size="12" fill="#262626" font-weight="bold">container_01</text>
  <rect x="180" y="76" width="52" height="18" rx="4" fill="#f6ffed" stroke="#b7eb8f"/>
  <circle cx="188" cy="85" r="3" fill="#52c41a"/>
  <text x="194" y="89" font-size="9" fill="#389e0d">online</text>
  <text x="84" y="108" font-size="10" fill="#8c8c8c">ubuntu:24.04 · 192.168.5.23</text>
  <text x="84" y="126" font-size="10" fill="#ad6800">剩余时间：6天 12小时（每秒跳动）</text>
  <rect x="84" y="136" width="44" height="20" rx="4" fill="#ffffff" stroke="#d9d9d9"/><text x="96" y="150" font-size="9" fill="#595959">停止</text>
  <rect x="134" y="136" width="44" height="20" rx="4" fill="#ffffff" stroke="#d9d9d9"/><text x="146" y="150" font-size="9" fill="#595959">重启</text>
  <rect x="184" y="136" width="44" height="20" rx="4" fill="#fff1f0" stroke="#ffa39e"/><text x="196" y="150" font-size="9" fill="#cf1322">删除</text>

  <!-- 容器卡片2 -->
  <rect x="72" y="172" width="216" height="96" rx="8" fill="#ffffff" stroke="#f0f0f0"/>
  <text x="84" y="192" font-size="12" fill="#262626" font-weight="bold">container_02</text>
  <rect x="180" y="180" width="60" height="18" rx="4" fill="#e6f4ff" stroke="#91caff"/>
  <circle cx="188" cy="189" r="3" fill="#1677ff"/>
  <text x="194" y="193" font-size="9" fill="#0958d9">creating</text>
  <text x="84" y="212" font-size="10" fill="#8c8c8c">ubuntu:22.04 · 192.168.5.24</text>
  <text x="84" y="230" font-size="10" fill="#8c8c8c">等待就绪，构建完成后自动 online</text>
  <text x="84" y="252" font-size="10" fill="#1677ff">点卡片可查看详情（协作 / 长期容器）</text>

  <!-- 详情卡片 -->
  <rect x="72" y="284" width="216" height="92" rx="8" fill="#ffffff" stroke="#91caff" stroke-width="1.2"/>
  <text x="84" y="306" font-size="12" fill="#262626" font-weight="bold">容器详情 · container_01</text>
  <text x="84" y="324" font-size="10" fill="#595959">镜像 ubuntu:24.04 · 端口 2233</text>
  <text x="84" y="342" font-size="10" fill="#595959">协作者：</text>
  <rect x="132" y="332" width="36" height="16" rx="3" fill="#fff1f0" stroke="#ffa39e"/><text x="138" y="344" font-size="8" fill="#cf1322">root</text>
  <rect x="172" y="332" width="66" height="16" rx="3" fill="#e6f4ff" stroke="#91caff"/><text x="178" y="344" font-size="8" fill="#0958d9">collaborator</text>
  <rect x="242" y="332" width="36" height="16" rx="3" fill="#fff7e6" stroke="#ffd591"/><text x="248" y="344" font-size="8" fill="#d46b08">admin</text>
  <text x="84" y="364" font-size="10" fill="#595959">长期容器：是（免自动清理，每人限1个）</text>

  <!-- 底部说明 -->
  <rect x="72" y="396" width="216" height="54" rx="6" fill="#fffbe6" stroke="#ffe58f"/>
  <text x="82" y="414" font-size="10" fill="#ad6800">① 状态随操作流转（启动/停止/重启）</text>
  <text x="82" y="430" font-size="10" fill="#ad6800">② 剩余时间 = 自动清理倒计时</text>
  <text x="82" y="446" font-size="10" fill="#ad6800">③ 删除不可恢复，操作前确认</text>
</svg>
