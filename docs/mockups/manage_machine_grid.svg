<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">manage_machine card-grid mockup</title>
  <desc id="desc">Static mockup for manage_machine: left sidebar, compact filter bar, machine cards with an action rail, and nested fixed-size container cards with operation icons.</desc>
  <defs>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="132%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <style>
      .page { fill: #eef3f8; }
      .side { fill: #f8fafc; stroke: #dbe2ea; stroke-width: 1; }
      .side-active { fill: #e8f1ff; stroke: #9dbff2; stroke-width: 1; }
      .top { fill: #ffffff; stroke: #dbe2ea; stroke-width: 1; }
      .card { fill: #ffffff; stroke: #1f2937; stroke-width: 2.5; filter: url(#shadow); }
      .rail { fill: #f8fafc; stroke: #d7dee8; stroke-width: 1; }
      .slot { fill: #f5f9fd; stroke: #c7d6e8; stroke-width: 1.5; }
      .slot-online { fill: #e9f7ef; stroke: #58a878; stroke-width: 1.5; }
      .slot-offline { fill: #f5f7fa; stroke: #aeb8c4; stroke-width: 1.5; }
      .slot-warn { fill: #fff7e6; stroke: #dfa33a; stroke-width: 1.5; }
      .slot-busy { fill: #eaf3ff; stroke: #5b8fd1; stroke-width: 1.5; }
      .chip { fill: #edf2f7; stroke: #d8e0ea; stroke-width: 1; }
      .chip-blue { fill: #e8f1ff; stroke: #92b8ef; stroke-width: 1; }
      .chip-green { fill: #e8f6ef; stroke: #82c69e; stroke-width: 1; }
      .chip-red { fill: #fff0f0; stroke: #e99a9a; stroke-width: 1; }
      .chip-yellow { fill: #fff7e6; stroke: #e6c06b; stroke-width: 1; }
      .btn { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
      .btn-primary { fill: #1677ff; stroke: #1677ff; stroke-width: 1; }
      .btn-danger { fill: #fff1f0; stroke: #ffccc7; stroke-width: 1; }
      .bar-bg { fill: #edf2f7; }
      .bar-cpu { fill: #1677ff; }
      .bar-mem { fill: #13a17b; }
      .bar-gpu { fill: #7c3aed; }
      .text { fill: #1f2937; font-family: Arial, sans-serif; font-size: 15px; }
      .small { fill: #475569; font-family: Arial, sans-serif; font-size: 12px; }
      .tiny { fill: #64748b; font-family: Arial, sans-serif; font-size: 10px; }
      .label { fill: #64748b; font-family: Arial, sans-serif; font-size: 11px; }
      .title { fill: #111827; font-family: Arial, sans-serif; font-size: 20px; font-weight: 700; }
      .card-title { fill: #111827; font-family: Arial, sans-serif; font-size: 17px; font-weight: 700; }
      .white { fill: #ffffff; font-family: Arial, sans-serif; font-size: 12px; font-weight: 700; }
      .icon-blue { fill: none; stroke: #1677ff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect class="page" width="1600" height="980"/>
  <rect class="side" x="0" y="0" width="224" height="980"/>
  <text class="title" x="28" y="46">Fuxi</text>
  <text class="small" x="28" y="70">Admin</text>
  <rect class="chip" x="24" y="112" width="176" height="44" rx="6"/><text class="text" x="60" y="140">Users</text>
  <rect class="side-active" x="24" y="168" width="176" height="44" rx="6"/><text class="text" x="60" y="196">Machines</text>
  <rect class="chip" x="24" y="224" width="176" height="44" rx="6"/><text class="text" x="60" y="252">Announcements</text>
  <rect class="chip" x="24" y="280" width="176" height="44" rx="6"/><text class="text" x="60" y="308">Logs</text>

  <rect class="top" x="224" y="0" width="1376" height="88"/>
  <text class="title" x="260" y="36">Manage Machine</text>
  <text class="small" x="260" y="60">machine card contains a fixed 2x2 container preview and common operations</text>
  <rect class="btn" x="570" y="24" width="190" height="38" rx="6"/><text class="small" x="590" y="48">machine / ip</text>
  <rect class="btn" x="776" y="24" width="190" height="38" rx="6"/><text class="small" x="796" y="48">container</text>
  <rect class="btn-primary" x="984" y="24" width="94" height="38" rx="6"/><text class="white" x="1016" y="48">Search</text>
  <rect class="btn" x="1092" y="24" width="128" height="38" rx="6"/><text class="text" x="1116" y="48">Register</text>

